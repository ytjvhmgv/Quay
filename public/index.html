<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Quay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141a12'/%3E%3Cpath d='M7 22V10h4.2c2.7 0 4.3 1.4 4.3 3.6 0 1.5-.8 2.7-2.1 3.2L17 22h-3.3l-3-4.6H10V22H7zm3-7h1.1c1.2 0 1.9-.6 1.9-1.5S12.3 12 11.1 12H10v3zM19 22V10h3v12h-3z' fill='%23d6f25c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <section id="login" class="gate hidden">
    <form id="login-form" class="gate-card">
      <div class="mark" aria-hidden="true"></div>
      <h1>Quay</h1>
      <p>网页编程代理。文件放在 Cloudflare R2，模型走你的 sub2api。</p>
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">进入</button>
      <p id="login-error" class="form-error"></p>
    </form>
  </section>

  <div id="app" class="app hidden">
    <header class="top">
      <div class="brand">
        <span class="mark small" aria-hidden="true"></span>
        <div>
          <strong>Quay</strong>
          <span>R2 工作区</span>
        </div>
      </div>
      <label class="project-picker">
        <span>项目</span>
        <select id="project-select"></select>
      </label>
      <button id="new-project" type="button">新建</button>
      <button id="rename-project" type="button">重命名</button>
      <button id="delete-project" type="button">删除</button>
      <label class="model-picker">
        <span>模型</span>
        <input id="model-input" list="model-list" placeholder="sub2api 模型名" />
        <datalist id="model-list"></datalist>
      </label>
      <div class="status-pills">
        <span id="r2-pill" class="pill">R2</span>
        <span id="model-pill" class="pill">模型</span>
      </div>
      <button id="open-settings" type="button">设置</button>
      <button id="logout" type="button" class="ghost">退出</button>
    </header>
    <div id="setup-banner" class="banner hidden">还没配好。需要 Cloudflare R2，以及 sub2api 的地址、密钥和模型。<button id="banner-settings" type="button">打开设置</button></div>
    <div class="tabs">
      <button type="button" data-tab="chat" class="active">对话</button>
      <button type="button" data-tab="files">文件</button>
      <button type="button" data-tab="chats">会话</button>
    </div>
    <div class="workspace">
      <aside id="chats-pane" class="pane chats">
        <div class="pane-head">
          <h2>会话</h2>
          <button id="new-chat" type="button">新对话</button>
        </div>
        <div id="chat-list" class="list"></div>
      </aside>
      <main id="chat-pane" class="pane conversation">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="说说要改什么。Enter 发送，Shift+Enter 换行。"></textarea>
          <div class="composer-bar">
            <span id="active-file" class="hint">没有打开文件</span>
            <button id="stop" type="button" class="ghost hidden">停止</button>
            <button id="send" type="submit">发送</button>
          </div>
        </form>
      </main>
      <aside id="files-pane" class="pane files">
        <div class="pane-head">
          <h2>文件</h2>
          <div class="icon-buttons">
            <button id="new-file" type="button">新建</button>
            <button id="new-folder" type="button">目录</button>
            <button id="upload-btn" type="button">上传</button>
            <button id="refresh-tree" type="button">刷新</button>
          </div>
        </div>
        <input id="upload-input" type="file" multiple hidden />
        <div id="tree" class="tree"></div>
        <section id="editor" class="editor hidden">
          <div class="editor-bar">
            <strong id="editor-path"></strong>
            <div>
              <button id="save-file" type="button">保存</button>
              <button id="download-file" type="button" class="ghost">下载</button>
              <button id="delete-file" type="button" class="ghost">删除</button>
              <button id="close-file" type="button" class="ghost">关闭</button>
            </div>
          </div>
          <img id="editor-image" alt="" class="hidden" />
          <textarea id="editor-text" spellcheck="false"></textarea>
        </section>
      </aside>
    </div>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <form id="modal-card" class="modal-card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="ghost">取消</button>
        <button id="modal-ok" type="submit">确定</button>
      </div>
    </form>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
