<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Quay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2313181a'/%3E%3Cpath d='M7 22V10h4.2c2.7 0 4.3 1.4 4.3 3.6 0 1.5-.8 2.7-2.1 3.2L17 22h-3.3l-3-4.6H10V22H7zm3-7h1.1c1.2 0 1.9-.6 1.9-1.5S12.3 12 11.1 12H10v3zM19 22V10h3v12h-3z' fill='%2352c5f0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- LOGIN GATE -->
  <section id="login" class="gate hidden">
    <div class="gate-bg"></div>
    <form id="login-form" class="gate-card">
      <div class="gate-logo">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="9" fill="#13181a"/>
          <path d="M7 22V10h4.2c2.7 0 4.3 1.4 4.3 3.6 0 1.5-.8 2.7-2.1 3.2L17 22h-3.3l-3-4.6H10V22H7zm3-7h1.1c1.2 0 1.9-.6 1.9-1.5S12.3 12 11.1 12H10v3zM19 22V10h3v12h-3z" fill="#52c5f0"/>
        </svg>
        <span class="gate-name">Quay</span>
      </div>
      <p class="gate-desc">网页编程代理。文件存于 Cloudflare R2，模型走 sub2api。</p>
      <div class="field">
        <label for="password">访问密码</label>
        <div class="input-wrap">
          <svg class="input-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a4 4 0 0 0-4 4v1H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1V5a4 4 0 0 0-4-4zm0 1.5A2.5 2.5 0 0 1 10.5 5v1h-5V5A2.5 2.5 0 0 1 8 2.5zM8 9a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required />
        </div>
      </div>
      <button type="submit" class="btn-primary full">进入</button>
      <p id="login-error" class="form-error"></p>
    </form>
  </section>

  <!-- MAIN APP -->
  <div id="app" class="app hidden">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="7" fill="#13181a"/>
            <path d="M7 22V10h4.2c2.7 0 4.3 1.4 4.3 3.6 0 1.5-.8 2.7-2.1 3.2L17 22h-3.3l-3-4.6H10V22H7zm3-7h1.1c1.2 0 1.9-.6 1.9-1.5S12.3 12 11.1 12H10v3zM19 22V10h3v12h-3z" fill="#52c5f0"/>
          </svg>
          <span>Quay</span>
        </div>
        <div class="divider-v"></div>
        <div class="project-group">
          <label class="micro-label" for="project-select">项目</label>
          <div class="select-wrap">
            <select id="project-select"></select>
            <svg class="select-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="project-actions">
          <button id="new-project" type="button" class="btn-ghost btn-icon" title="新建项目">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
          </button>
          <button id="rename-project" type="button" class="btn-ghost btn-icon" title="重命名">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086zM11.189 6.25 9.75 4.81l-6.286 6.287a.25.25 0 0 0-.064.108l-.558 1.953 1.953-.558a.249.249 0 0 0 .108-.064l6.286-6.286z"/></svg>
          </button>
          <button id="delete-project" type="button" class="btn-ghost btn-icon btn-danger-icon" title="删除项目">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 1.75V3h2.25a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75ZM4.496 6.675l.66 6.6a.25.25 0 0 0 .249.225h5.19a.25.25 0 0 0 .249-.225l.66-6.6a.75.75 0 0 1 1.492.149l-.66 6.6A1.748 1.748 0 0 1 10.595 15h-5.19a1.75 1.75 0 0 1-1.741-1.575l-.66-6.6a.75.75 0 1 1 1.492-.15ZM6.5 1.75V3h3V1.75a.25.25 0 0 0-.25-.25h-2.5a.25.25 0 0 0-.25.25Z"/></svg>
          </button>
        </div>
      </div>

      <div class="topbar-center">
        <div class="model-group">
          <svg class="model-icon" width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm4.879-2.773 4.264 2.559a.25.25 0 0 1 0 .428l-4.264 2.559A.25.25 0 0 1 6 10.559V5.442a.25.25 0 0 1 .379-.215Z"/></svg>
          <input id="model-input" list="model-list" placeholder="输入模型名…" />
          <datalist id="model-list"></datalist>
        </div>
        <div class="status-row">
          <span id="r2-pill" class="status-chip">
            <span class="chip-dot"></span>R2
          </span>
          <span id="model-pill" class="status-chip">
            <span class="chip-dot"></span>模型
          </span>
        </div>
      </div>

      <div class="topbar-right">
        <button id="open-settings" type="button" class="btn-ghost" title="设置">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8.2 8.2 0 0 1 .701.031C9.444.095 9.99.645 10.16 1.29l.288 1.107c.018.066.079.158.212.224.231.114.454.243.668.386.123.082.233.09.299.071l1.103-.303c.644-.176 1.392.021 1.82.63.27.385.506.792.704 1.218.315.675.111 1.422-.364 1.891l-.814.806c-.049.048-.098.147-.088.294.016.257.016.515 0 .772-.01.147.038.246.088.294l.814.806c.475.469.679 1.216.364 1.891a7.977 7.977 0 0 1-.704 1.217c-.428.61-1.176.807-1.82.63l-1.102-.302c-.067-.019-.177-.011-.3.071a5.909 5.909 0 0 1-.668.386c-.133.066-.194.158-.211.224l-.29 1.106c-.168.646-.715 1.196-1.458 1.26a8.006 8.006 0 0 1-1.402 0c-.743-.064-1.289-.614-1.458-1.26l-.289-1.106c-.018-.066-.079-.158-.212-.224a5.738 5.738 0 0 1-.668-.386c-.123-.082-.233-.09-.299-.071l-1.103.303c-.644.176-1.392-.021-1.82-.63a8.12 8.12 0 0 1-.704-1.218c-.315-.675-.111-1.422.364-1.891l.814-.806c.049-.048.098-.147.088-.294a6.214 6.214 0 0 1 0-.772c.01-.147-.038-.246-.088-.294l-.814-.806C.635 6.045.431 5.298.746 4.623a7.92 7.92 0 0 1 .704-1.217c.428-.61 1.176-.807 1.82-.63l1.102.302c.067.019.177.011.3-.071.214-.143.437-.272.668-.386.133-.066.194-.158.211-.224l.29-1.106C6.009.645 6.556.095 7.299.03 7.53.01 7.764 0 8 0Zm-.571 1.525c-.036.003-.108.036-.137.146l-.289 1.105c-.147.561-.549.967-.998 1.189-.173.086-.34.183-.5.29-.417.278-.97.423-1.529.27l-1.103-.303c-.109-.03-.175.016-.195.045-.22.312-.412.644-.573.99-.014.031-.021.11.059.19l.815.806c.411.406.562.957.53 1.456a4.709 4.709 0 0 0 0 .582c.032.499-.119 1.05-.53 1.456l-.815.806c-.081.08-.073.159-.059.19.162.346.353.677.573.989.02.03.085.076.195.046l1.102-.303c.56-.153 1.113-.008 1.53.27.161.107.328.204.501.29.447.222.85.629.997 1.189l.289 1.105c.029.109.101.143.137.146a6.6 6.6 0 0 0 1.142 0c.036-.003.108-.036.137-.146l.289-1.105c.147-.561.549-.967.998-1.189.173-.086.34-.183.5-.29.417-.278.97-.423 1.529-.27l1.103.303c.109.029.175-.016.195-.045.22-.313.411-.644.573-.99.014-.031.021-.11-.059-.19l-.815-.806c-.411-.406-.562-.957-.53-1.456a4.709 4.709 0 0 0 0-.582c-.032-.499.119-1.05.53-1.456l.815-.806c.081-.08.073-.159.059-.19a6.464 6.464 0 0 0-.573-.989c-.02-.03-.085-.076-.195-.046l-1.102.303c-.56.153-1.113.008-1.53-.27a4.44 4.44 0 0 0-.501-.29c-.447-.222-.85-.629-.997-1.189l-.289-1.105c-.029-.11-.101-.143-.137-.146a6.6 6.6 0 0 0-1.142 0ZM8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM6.5 8a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0 3 0Z" fill-rule="evenodd" clip-rule="evenodd"/></svg>
          设置
        </button>
        <button id="logout" type="button" class="btn-ghost btn-icon hidden" title="退出">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h5.5c.966 0 1.75.784 1.75 1.75v3.342a.75.75 0 0 1-1.5 0V2.75a.25.25 0 0 0-.25-.25h-5.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h5.5a.25.25 0 0 0 .25-.25V9.908a.75.75 0 0 1 1.5 0v3.342A1.75 1.75 0 0 1 9.25 15h-5.5A1.75 1.75 0 0 1 2 13.25Zm10.72-1.22a.75.75 0 0 1 1.06 0l2.25 2.25a.75.75 0 0 1 0 1.06l-2.25 2.25a.75.75 0 1 1-1.06-1.06l.97-.97H7.75a.75.75 0 0 1 0-1.5h5.94l-.97-.97a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
    </header>

    <!-- SETUP BANNER -->
    <div id="setup-banner" class="setup-banner hidden">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>
      <span>还没配好 R2 和 sub2api，先去设置好再使用。</span>
      <button id="banner-settings" type="button" class="btn-ghost btn-sm">打开设置</button>
    </div>

    <!-- MOBILE TABS -->
    <div class="mobile-tabs">
      <button type="button" data-tab="chats" class="mtab">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v6.5A1.75 1.75 0 0 1 14.25 12H8.06l-2.573 2.573A1.457 1.457 0 0 1 3 13.543V12H1.75A1.75 1.75 0 0 1 0 10.25v-6.5C0 2.784.784 2 1.75 2Z"/></svg>
        <span>会话</span>
      </button>
      <button type="button" data-tab="chat" class="mtab active">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.75A.75.75 0 0 1 .75 1h7.5a.75.75 0 0 1 .75.75v3.5A.75.75 0 0 1 8.25 6H7v2.5a.75.75 0 0 1-1.28.53L3.5 6.75H.75A.75.75 0 0 1 0 6V1.75ZM1.5 2.5v3H3.5a.75.75 0 0 1 .53.22l1.22 1.22V6a.75.75 0 0 1 .75-.75H7.5v-3Zm9-.75A.75.75 0 0 1 11.25 1h3a.75.75 0 0 1 .75.75v6.5a.75.75 0 0 1-.75.75H13.5v3.25a.75.75 0 0 1-1.28.53l-3.22-3.25a.75.75 0 0 1 .53-1.28H10.5V2.5H11.25a.75.75 0 0 0 0-1.5h-3Z"/></svg>
        <span>对话</span>
      </button>
      <button type="button" data-tab="files" class="mtab">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
        <span>文件</span>
      </button>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace">

      <!-- CHATS PANE -->
      <aside id="chats-pane" class="pane pane-chats">
        <div class="pane-head">
          <span class="pane-title">会话</span>
          <button id="new-chat" type="button" class="btn-ghost btn-sm">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
            新对话
          </button>
        </div>
        <div id="chat-list" class="chat-list"></div>
      </aside>

      <!-- CHAT PANE -->
      <main id="chat-pane" class="pane pane-chat">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="说说要改什么，或者提个问题…"></textarea>
          <div class="composer-toolbar">
            <div class="toolbar-selects">
              <div class="toolbar-select-group">
                <label class="micro-label" for="composer-model">模型</label>
                <div class="select-wrap select-wrap-sm">
                  <select id="composer-model">
                    <option value="">跟随顶栏</option>
                  </select>
                  <svg class="select-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </div>
              </div>
              <div class="toolbar-select-group">
                <label class="micro-label" for="composer-effort">推理强度</label>
                <div class="select-wrap select-wrap-sm">
                  <select id="composer-effort">
                    <option value="default">默认</option>
                    <option value="low">低</option>
                    <option value="medium">中</option>
                    <option value="high">高</option>
                    <option value="max">最高</option>
                  </select>
                  <svg class="select-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </div>
              </div>
            </div>
          </div>
          <div class="composer-footer">
            <span id="active-file" class="active-file-hint">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1.5c0-.276.224-.5.5-.5h5.086c.133 0 .26.053.354.146l2.414 2.414c.093.094.146.221.146.354V10.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V1.5Z"/></svg>
              没有打开文件
            </span>
            <div class="composer-actions">
              <button id="stop" type="button" class="btn-ghost btn-sm hidden">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
                停止
              </button>
              <button id="send" type="submit" class="btn-primary btn-sm">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M.989 8 .064 2.68a1.342 1.342 0 0 1 1.85-1.462l13.402 5.744a1.13 1.13 0 0 1 0 2.076L1.913 14.782a1.343 1.343 0 0 1-1.85-1.463L.99 8Zm.603-5.288L2.38 7.25h4.87a.75.75 0 0 1 0 1.5H2.38l-.788 4.538L13.929 8Z"/></svg>
                发送
              </button>
            </div>
          </div>
        </form>
      </main>

      <!-- FILES PANE -->
      <aside id="files-pane" class="pane pane-files">
        <div class="pane-head">
          <span class="pane-title">文件</span>
          <div class="file-actions">
            <button id="new-file" type="button" class="btn-ghost btn-icon" title="新建文件">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
            </button>
            <button id="new-folder" type="button" class="btn-ghost btn-icon" title="新建目录">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75ZM8.75 7.75a.75.75 0 0 0-1.5 0v1.5h-1.5a.75.75 0 0 0 0 1.5h1.5v1.5a.75.75 0 0 0 1.5 0v-1.5h1.5a.75.75 0 0 0 0-1.5h-1.5v-1.5Z"/></svg>
            </button>
            <button id="upload-btn" type="button" class="btn-ghost btn-icon" title="上传文件">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8.75 1.018a.75.75 0 0 0-1.5 0V5.5H2.75a.75.75 0 0 0 0 1.5h4.5v8.25a.75.75 0 0 0 1.5 0V7h4.5a.75.75 0 0 0 0-1.5h-4.5V1.018Z"/><path d="M1.018 7.75a.75.75 0 0 0 0 1.5h13.964a.75.75 0 0 0 0-1.5H1.018Z" opacity=".4"/></svg>
            </button>
            <button id="refresh-tree" type="button" class="btn-ghost btn-icon" title="刷新">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg>
            </button>
          </div>
        </div>
        <input id="upload-input" type="file" multiple hidden />
        <div id="tree" class="file-tree"></div>
        <section id="editor" class="editor hidden">
          <div class="editor-head">
            <svg class="file-icon-sm" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1.5c0-.276.224-.5.5-.5h5.086c.133 0 .26.053.354.146l2.414 2.414c.093.094.146.221.146.354V10.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V1.5Z"/></svg>
            <strong id="editor-path" class="editor-path-label"></strong>
            <div class="editor-btns">
              <button id="save-file" type="button" class="btn-primary btn-xs">保存</button>
              <button id="download-file" type="button" class="btn-ghost btn-xs">下载</button>
              <button id="delete-file" type="button" class="btn-ghost btn-xs btn-danger-ghost">删除</button>
              <button id="close-file" type="button" class="btn-ghost btn-icon btn-xs" title="关闭">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2.22 2.22a.75.75 0 0 1 1.06 0L6 4.94l2.72-2.72a.75.75 0 1 1 1.06 1.06L7.06 6l2.72 2.72a.75.75 0 1 1-1.06 1.06L6 7.06 3.28 9.78a.75.75 0 0 1-1.06-1.06L4.94 6 2.22 3.28a.75.75 0 0 1 0-1.06Z"/></svg>
              </button>
            </div>
          </div>
          <img id="editor-image" alt="" class="hidden" />
          <textarea id="editor-text" spellcheck="false"></textarea>
        </section>
      </aside>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <form id="modal-card" class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-x" type="button" class="btn-ghost btn-icon btn-xs">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2.22 2.22a.75.75 0 0 1 1.06 0L6 4.94l2.72-2.72a.75.75 0 1 1 1.06 1.06L7.06 6l2.72 2.72a.75.75 0 1 1-1.06 1.06L6 7.06 3.28 9.78a.75.75 0 0 1-1.06-1.06L4.94 6 2.22 3.28a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" type="button" class="btn-ghost">取消</button>
        <button id="modal-ok" type="submit" class="btn-primary">确定</button>
      </div>
    </form>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
